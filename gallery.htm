		<!-- Lightbox HTML, CSS, and JS -->
		<div id="lightbox" class="lightbox">
			<span class="close-btn">&times;</span>
			<img class="lightbox-content" id="lightbox-img">
		</div>

		<style>
			.lightbox { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.9); }
			.lightbox-content { margin: auto; display: block; max-width: 90%; max-height: 90%; margin-top: 5%; border-radius: 4px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
			.close-btn { position: absolute; top: 25px; right: 35px; color: #f1f1f1; font-size: 40px; font-weight: bold; transition: 0.3s; cursor: pointer; }
			.close-btn:hover, .close-btn:focus { color: #bbb; text-decoration: none; cursor: pointer; }
			.gallery-img { cursor: pointer; transition: 0.3s; }
			.gallery-img:hover { opacity: 0.7; }
		</style>

		<script>
			document.addEventListener('DOMContentLoaded', function() {
				var modal = document.getElementById("lightbox");
				var modalImg = document.getElementById("lightbox-img");
				var images = document.getElementsByClassName("gallery-img");
				var span = document.getElementsByClassName("close-btn")[0];

				for(var i = 0; i < images.length; i++) {
					images[i].onclick = function(){
						modal.style.display = "block";
						modalImg.src = this.src;
					}
				}

				span.onclick = function() { modal.style.display = "none"; }
				modal.onclick = function(e) { if (e.target !== modalImg) { modal.style.display = "none"; } }
			});
		</script>
